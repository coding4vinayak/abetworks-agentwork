[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abetworks-agentwork"
version = "2.0.0"
description = "Production-grade agent framework with retry, scheduling, and fleet management"
readme = "README.md"
authors = [{ name = "Abet Works", email = "info@abetworks.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "croniter>=1.3",
    "tenacity>=8.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["ai", "agents", "automation", "framework", "retry", "scheduling"]

[project.optional-dependencies]
server = ["fastapi>=0.100.0", "uvicorn>=0.23.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "httpx>=0.24.0",
]

[project.scripts]
agentwork = "agentwork.cli:main"

[project.urls]
Homepage = "https://github.com/abetworks/abetworks-agentwork"
"Bug Tracker" = "https://github.com/abetworks/abetworks-agentwork/issues"
Documentation = "https://docs.abetworks.in"
"Source Code" = "https://github.com/abetworks/abetworks-agentwork"

[tool.setuptools.packages.find]
include = ["agentwork*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
